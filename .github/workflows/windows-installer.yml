name: Windows installer

on:
  # בנייה רק בהפעלה ידנית, כדי לחסוך בדקות של המאגר הפרטי. הפרסום האמיתי נעשה ב-mizrak-releases
  workflow_dispatch:
    inputs:
      release_version:
        description: 'מספר גרסה לפרסום (למשל 2.1.0). ריק = בנייה בלי פרסום'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'yarn'
      - run: yarn
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Set version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
        shell: bash
        run: yarn version --no-git-tag-version --new-version "${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
      - run: yarn build
      # בדחיפת תג (v1.0.0 וכדומה) נוצר שחרור ב-GitHub, ומשם התוכנה מקבלת עדכונים אוטומטיים
      - name: Build installer and publish if requested
        shell: bash
        run: ./node_modules/.bin/electron-builder --config electron-builder.yml --win --publish ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release_version != '') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: mizrak-windows
          path: |
            dist/*.exe
